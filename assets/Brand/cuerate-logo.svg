<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img">
  <title>Cuerate</title>
  <desc>Cuerate logo — geometric C icon with wordmark</desc>

  <!-- Icon: geometric C with two accent dots -->
  <g transform="translate(24, 24)">
    <!-- Bold C arc -->
    <path d="M 14 -18 A 20 20 0 1 0 14 18" fill="none" stroke="#7C5CFC" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Top accent dot -->
    <circle cx="14" cy="-18" r="3.5" fill="#7C5CFC"/>
    <!-- Bottom accent dot (lighter) -->
    <circle cx="14" cy="18" r="3.5" fill="#AFA9EC"/>
  </g>

  <!-- Wordmark -->
  <text x="54" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="17" font-weight="500" letter-spacing="3" fill="#F0EFF8">CUERATE</text>

  <!-- Tagline -->
  <text x="55" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="7" font-weight="300" letter-spacing="3" fill="#8A89A0">DJ COMPANION</text>
</svg>
